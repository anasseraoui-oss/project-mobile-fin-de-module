spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:elearning_app}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_ISSUER_URI:http://10.0.2.2:9000}
          jwk-set-uri: ${AUTH_SERVER_URL:http://auth-server:9000}/oauth2/jwks

minio:
  url: ${MINIO_INTERNAL_URL:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:admin}
  secret-key: ${MINIO_ROOT_PASSWORD:minio_secret_password}
  bucket-media: elearning-media
  bucket-public: elearning-public
  bucket-uploads: elearning-uploads

firebase:
  service-account-path: ${FIREBASE_CREDENTIALS:classpath:firebase-service-account.json}

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    com.elearning: DEBUG
