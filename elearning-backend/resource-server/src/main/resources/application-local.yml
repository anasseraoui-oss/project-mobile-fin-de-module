spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:elearning_app}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:${AUTH_SERVER_PORT:9000}
          jwk-set-uri: http://localhost:${AUTH_SERVER_PORT:9000}/oauth2/jwks

minio:
  url: http://localhost:9003
  public-url: http://localhost:9003
  access-key: ${MINIO_ROOT_USER:admin}
  secret-key: ${MINIO_ROOT_PASSWORD:minio_secret_password}
