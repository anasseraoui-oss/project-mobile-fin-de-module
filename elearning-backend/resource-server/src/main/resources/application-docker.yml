spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:elearning_app}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_ISSUER_URI:http://auth-server:9000}
          jwk-set-uri: ${AUTH_SERVER_URL:http://auth-server:9000}/oauth2/jwks

minio:
  url: ${MINIO_INTERNAL_URL:http://minio:9000}
  public-url: ${MINIO_PUBLIC_URL:${MINIO_PUBLIC_ORIGIN:http://minio:9000}}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
